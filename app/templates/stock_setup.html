<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stok Awal</title><style>body{background:#eef2f5;font-family:Arial}.wrap{max-width:800px;margin:30px auto}.card{background:white;padding:22px;border-radius:11px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}input,select,textarea{width:100%;padding:10px;box-sizing:border-box}.full{grid-column:1/-1}.btn{margin-top:15px;padding:10px 15px;background:#0b4388;color:white;border:0;border-radius:7px}</style></head><body><main class="wrap"><section class="card"><h1>Input Stok Awal</h1><form method="post"><div class="grid"><div><label>Gudang</label><select name="warehouse_id" required><option value="">Pilih</option>{% for w in warehouses %}<option value="{{ w['id'] }}">{{ w["kode_gudang"] }} — {{ w["nama_gudang"] }}</option>{% endfor %}</select></div><div><label>Produk</label><select name="product_id" required><option value="">Pilih</option>{% for p in products %}<option value="{{ p['id'] }}">{{ p["kode_produk"] or "-" }} — {{ p["nama_produk"] }}</option>{% endfor %}</select></div><div><label>Stok Awal</label><input type="number" min="0" name="stok_awal" value="0"></div><div><label>Minimum Stok</label><input type="number" min="0" name="minimum_stok" value="0"></div><div><label>Tanggal</label><input type="date" name="tanggal" required></div><div class="full"><label>Catatan</label><textarea name="catatan"></textarea></div></div><button class="btn">Simpan Stok</button></form></section></main></body></html>
