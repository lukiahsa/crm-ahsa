<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tambah Gudang</title><style>body{background:#eef2f5;font-family:Arial}.wrap{max-width:800px;margin:30px auto}.card{background:white;padding:22px;border-radius:11px}input,textarea,select{width:100%;padding:10px;margin:6px 0 14px;box-sizing:border-box}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}.btn{padding:10px 15px;border:0;border-radius:7px;background:#0b4388;color:white;font-weight:bold}</style></head><body><main class="wrap"><section class="card"><h1>Tambah Gudang</h1><form method="post"><div class="grid"><div><label>Kode Gudang</label><input name="kode_gudang" required></div><div><label>Nama Gudang</label><input name="nama_gudang" required></div><div><label>Penanggung Jawab</label><input name="penanggung_jawab"></div><div><label>Status</label><select name="aktif"><option value="1">Aktif</option><option value="0">Nonaktif</option></select></div><div class="full"><label>Alamat</label><textarea name="alamat"></textarea></div></div><button class="btn">Simpan Gudang</button></form></section></main></body></html>
