<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Generate Receipt dari Transaction</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef2f5;font-family:Arial,sans-serif;color:#17212b}.wrap{width:min(820px,calc(100% - 28px));margin:30px auto}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.head h1{margin:0;color:#0b4388}.sub{color:#687784;margin-top:6px}.card{background:white;padding:20px;border-radius:12px;margin-top:16px;box-shadow:0 4px 18px rgba(20,40,60,.08)}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.info{background:#f6f9fb;padding:12px;border-radius:8px}.info small{display:block;color:#687784}.info strong{display:block;margin-top:5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}label{display:block;font-size:12px;font-weight:800;margin-bottom:5px}input,select,textarea{width:100%;padding:10px;border:1px solid #cad5dd;border-radius:7px;font:inherit}textarea{min-height:80px}.full{grid-column:1/-1}.btn{display:inline-block;border:0;border-radius:7px;padding:11px 15px;text-decoration:none;font-weight:800;cursor:pointer}.gray{background:#6d7882;color:white}.blue{background:#0b4388;color:white}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:16px}@media(max-width:650px){.grid,.summary{grid-template-columns:1fr}.full{grid-column:auto}.head{flex-direction:column}}
</style></head><body><main class="wrap"><div class="head"><div><h1>Generate Receipt</h1><div class="sub">Receipt menjadi child langsung dari Transaction dan tidak mengubah rekonsiliasi Invoice.</div></div><a class="btn gray" href="{{ url_for('transaction_detail', transaction_id=transaction['id']) }}">Kembali</a></div>
<section class="card summary"><div class="info"><small>Transaction</small><strong>{{ transaction.nomor_transaksi }}</strong></div><div class="info"><small>Customer</small><strong>{{ transaction.customer_nama or '-' }}</strong></div><div class="info"><small>Nilai</small><strong>{{ format_rupiah(transaction.total_penjualan or 0) }}</strong></div></section>
<form method="post"><section class="card"><div class="grid"><div><label>Tanggal *</label><input type="date" name="tanggal" value="{{ today }}" required></div><div><label>Jenis Pembayaran *</label><select name="jenis_pembayaran">{% for item in receipt_types %}<option>{{ item }}</option>{% endfor %}</select></div><div><label>Metode *</label><select name="metode_pembayaran" required><option value="">Pilih</option>{% for item in receipt_methods %}<option>{{ item }}</option>{% endfor %}</select></div><div><label>Nominal *</label><input type="number" min="1" name="nominal" required></div><div><label>Bank</label><input name="bank"></div><div><label>Nomor Referensi</label><input name="nomor_referensi"></div><div class="full"><label>Untuk Pembayaran</label><input name="untuk_pembayaran" placeholder="Otomatis memakai nomor Transaction bila kosong"></div><div class="full"><label>Catatan</label><textarea name="catatan"></textarea></div><div><label>Dibuat oleh</label><input name="created_by" value="Admin"></div></div><div class="actions"><a class="btn gray" href="{{ url_for('transaction_detail', transaction_id=transaction['id']) }}">Batal</a><button class="btn blue" type="submit">Generate Receipt</button></div></section></form></main></body></html>
