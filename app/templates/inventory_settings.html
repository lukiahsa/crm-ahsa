<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pengaturan Gudang</title><style>*{box-sizing:border-box}body{margin:0;background:#eef2f5;font-family:Arial;color:#17212b}.wrap{max-width:850px;margin:32px auto;padding:0 14px}.card{background:white;border-radius:12px;padding:24px;box-shadow:0 4px 18px #14283c1a}h1{color:#0b4388}.row{display:flex;justify-content:space-between;align-items:center;border:1px solid #d7e0e7;padding:18px;border-radius:10px}.switch input{width:22px;height:22px}.btn{display:inline-block;padding:10px 15px;border:0;border-radius:7px;background:#0b4388;color:white;font-weight:bold;text-decoration:none}.actions{text-align:right;margin-top:18px}.note{margin-top:15px;background:#fff8df;border:1px solid #efd97b;padding:12px;border-radius:8px}</style></head><body><main class="wrap"><section class="card"><h1>📦 Pengaturan Gudang</h1><form method="post"><div class="row"><div><strong>Aktifkan Modul Gudang</strong><p>Default nonaktif. Modul lain tetap berjalan normal.</p></div><label class="switch"><input type="checkbox" name="inventory_enabled" value="1" {% if settings and settings["inventory_enabled"] %}checked{% endif %}></label></div><div class="note"><strong>Aman:</strong> saat OFF, stok tidak dipotong otomatis dan menu gudang tidak wajib digunakan.</div><div class="actions"><button class="btn">Simpan Pengaturan</button></div></form></section></main></body></html>
