<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard CRM Ahsa</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #1f2937;
        }

        header {
            background: #17466f;
            color: white;
            padding: 24px 36px;
        }

        header h1 {
            margin: 0 0 8px;
        }

        nav {
            margin-top: 18px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 22px;
            font-weight: bold;
        }

        main {
            max-width: 1100px;
            margin: 36px auto;
            padding: 0 20px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-top: 28px;
        }

        .card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        .card h2 {
            margin: 0;
            color: #17466f;
            font-size: 34px;
        }

        .card p {
            margin-bottom: 0;
            color: #6b7280;
        }

        @media (max-width: 760px) {
            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>CRM AHSA EQUIPMENT</h1>
        <p>Dashboard Penjualan dan Database Customer</p>

        <nav>
            <a href="/">Dashboard</a>
            <a href="/customers">Customer</a>
        </nav>
    </header>

    <main>
        <h2>Dashboard</h2>
        <p>Ringkasan database customer Ahsa Equipment.</p>

        <section class="cards">
            <div class="card">
                <h2>{{ total_customer }}</h2>
                <p>Total Customer</p>
            </div>

            <div class="card">
                <h2>{{ prospek_aktif }}</h2>
                <p>Prospek Aktif</p>
            </div>

            <div class="card">
                <h2>{{ customer_closing }}</h2>
                <p>Customer Closing</p>
            </div>
        </section>
    </main>
</body>
</html>
